name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install lint tools
        run: pip install flake8

      - name: Syntax check
        run: |
          python -m py_compile training/winePrediction_model.py
          python -m py_compile prediction/winePrediction_application.py

      - name: Lint (errors only)
        run: flake8 training prediction --select=E9,F63,F7,F82 --show-source
